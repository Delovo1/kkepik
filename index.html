<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
<title>Расписание ККЭП</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 900px; margin: 0 auto;
    padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    line-height: 1.5; -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }

  .tabs { display: flex; gap: .25rem; margin: 1rem 0 .5rem; }
  .tab {
    flex: 1 1 0; padding: .55rem .75rem; font-size: .95rem;
    border: 1px solid #bbb; border-radius: 8px; background: transparent;
    color: inherit; cursor: pointer;
  }
  .tab.active { background: #2b6cb0; color: #fff; border-color: #2b6cb0; font-weight: 600; }

  .controls { display: flex; gap: .5rem; flex-wrap: wrap; align-items: flex-end; margin: .5rem 0 1rem; }
  .field { display: flex; flex-direction: column; gap: .25rem; flex: 1 1 12rem; min-width: 0; }
  .field label { font-size: .8rem; color: #666; }
  input[type="search"], input[type="text"], select, button {
    padding: .65rem .75rem; font-size: 1rem; width: 100%;
    border: 1px solid #bbb; border-radius: 8px;
    background: Field; color: FieldText;
  }
  select { padding-right: 2rem; }
  button.primary {
    cursor: pointer; background: #2b6cb0; color: #fff;
    border-color: #2b6cb0; flex: 1 1 12rem; font-weight: 600;
  }
  button.primary:active { transform: translateY(1px); }

  /* Подсветка рассинхрона поля поиска и селекта */
  input.mismatch { border-color: #e0a800; background: #fff9e6; }

  .banner {
    padding: .65rem .8rem; border-radius: 8px; margin: .5rem 0 1rem;
    font-size: .9rem; line-height: 1.4;
  }
  .banner.info  { background: #eaf3fb; color: #1a365d; border: 1px solid #b8d4ef; }
  .banner.warn  { background: #fff6e0; color: #6b4b00; border: 1px solid #f0d68a; }
  .banner.muted { background: #f0f0f0; color: #555; border: 1px solid #ddd; }

  .status { color: #666; font-size: .85rem; margin: .25rem 0 .75rem; word-break: break-word; }
  .error { color: #b00020; }

  .day { margin-top: 1rem; }
  .day h2 { font-size: 1.05rem; margin: 0 0 .25rem; }
  .day .meta { font-size: .8rem; color: #666; margin-bottom: .5rem; word-break: break-word; }
  .day .meta a { color: inherit; }

  table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
  th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; vertical-align: top; }
  th { background: #f4f4f4; font-weight: 600; }
  td.num { width: 2.5rem; text-align: center; }
  td.time { white-space: nowrap; }
  td.no-aud { text-align: center; }
  td.no-aud a { color: #888; text-decoration: none; border-bottom: 1px dotted #888; padding: 0 .2rem; }
  td.no-aud a:hover { color: #b00020; border-bottom-color: #b00020; }
  .empty { color: #666; font-style: italic; }

  .ac-wrap { position: relative; }
  .ac-list {
    position: absolute; z-index: 10; left: 0; right: 0; top: 100%;
    max-height: 14rem; overflow-y: auto;
    background: Canvas; border: 1px solid #bbb; border-radius: 8px;
    margin-top: .15rem; box-shadow: 0 4px 12px rgba(0,0,0,.1);
  }
  .ac-item { padding: .5rem .7rem; cursor: pointer; font-size: .95rem; }
  .ac-item:hover, .ac-item.active { background: #eaf3fb; }

  @media (prefers-color-scheme: dark) {
    .ac-item:hover, .ac-item.active { background: #23354a; }
    .ac-list { border-color: #555; }
    input.mismatch { background: #3a2f0a; border-color: #b58a00; }
  }

  @media (max-width: 640px) {
    body { padding: .75rem .75rem calc(.75rem + env(safe-area-inset-bottom)); }
    h1 { font-size: 1.15rem; }
    .controls { flex-direction: column; align-items: stretch; gap: .6rem; }
    .field { flex: 1 1 auto; width: 100%; }
    button.primary { flex: 1 1 auto; width: 100%; padding: .8rem; font-size: 1.05rem; }

    table, thead, tbody, tr, th, td { display: block; width: 100%; }
    thead { display: none; }
    tbody tr {
      border: 1px solid #ccc; border-radius: 10px;
      padding: .5rem .6rem; margin-bottom: .6rem; background: Canvas;
    }
    tbody tr + tr { margin-top: .6rem; }
    td {
      border: none; padding: .15rem 0;
      display: flex; gap: .5rem; align-items: baseline; font-size: .95rem;
    }
    td::before {
      content: attr(data-label);
      flex: 0 0 6.5rem; color: #888; font-size: .78rem;
      text-transform: uppercase; letter-spacing: .02em;
    }
    td.num, td.time, td.no-aud { text-align: left; width: auto; }
  }

  @media (prefers-color-scheme: dark) {
    th { background: #2a2a2a; }
    th, td { border-color: #444; }
    .status, .day .meta, .field label { color: #aaa; }
    td.no-aud a { color: #999; border-bottom-color: #999; }
    input[type="search"], input[type="text"], select {
      border-color: #555; background: #1e1e1e; color: #eee;
    }
    .banner.info  { background: #16283a; color: #cfe2f3; border-color: #2c4a6b; }
    .banner.warn  { background: #3b2e07; color: #ffe6a1; border-color: #6b550f; }
    .banner.muted { background: #232323; color: #bbb; border-color: #444; }
    tbody tr { border-color: #444; }
  }
</style>
</head>
<body>

<h1>Расписание ККЭП</h1>

<div class="tabs" role="tablist">
  <button class="tab active" id="tab-group"  role="tab" aria-selected="true">Группа</button>
  <button class="tab"        id="tab-teacher" role="tab" aria-selected="false">Преподаватель</button>
</div>

<div class="controls">
  <div class="field" id="field-group">
    <label for="search">Поиск группы</label>
    <input id="search" type="search" placeholder="например: 105 или ИСП" autocomplete="off">
  </div>

  <div class="field" id="field-teacher" hidden>
    <label for="teacher">Преподаватель</label>
    <div class="ac-wrap">
      <input id="teacher" type="text" placeholder="например: Шульга" autocomplete="off">
      <div class="ac-list" id="ac-list" hidden></div>
    </div>
  </div>

  <div class="field" id="field-select">
    <label for="group">Группа</label>
    <select id="group"></select>
  </div>

  <button class="primary" id="load">Показать расписание</button>
</div>

<div id="banner"></div>
<div class="status" id="status"></div>
<div id="result"></div>

<script>
const API = 'https://kkepik.rub1kub.ru';
const DEFAULT_GROUP = '105-Д9-3ИСП';

const bannerEl    = document.getElementById('banner');
const statusEl    = document.getElementById('status');
const resultEl    = document.getElementById('result');
const groupSelect = document.getElementById('group');
const searchInput = document.getElementById('search');
const teacherInput= document.getElementById('teacher');
const acList      = document.getElementById('ac-list');

const tabGroup   = document.getElementById('tab-group');
const tabTeacher = document.getElementById('tab-teacher');
const fieldGroup = document.getElementById('field-group');
const fieldTeacher = document.getElementById('field-teacher');
const fieldSelect  = document.getElementById('field-select');

let mode = 'group';
let allGroups = [];
let allTeachers = [];

// ---------- утилиты ----------
function parseGroup(name) {
  const m = name.match(/^([^-]+)-([^-]+)-(\d+)([A-Za-zА-Яа-яЁё]+)$/);
  if (!m) return null;
  return { code: m[1], dep: m[2], course: Number(m[3]), spec: m[4].toUpperCase() };
}
function collapseGroups(names) {
  const best = new Map();
  for (const name of names) {
    const p = parseGroup(name);
    if (!p) { best.set('raw:' + name, { name, course: -1 }); continue; }
    const key = `${p.code}-${p.dep}-${p.spec}`;
    const prev = best.get(key);
    if (!prev || p.course > prev.course) best.set(key, { name, course: p.course });
  }
  return [...best.values()].map(v => v.name).sort((a, b) => a.localeCompare(b, 'ru'));
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function plusDaysISO(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function humanDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

// ---------- переключение режимов ----------
tabGroup.addEventListener('click', () => switchMode('group'));
tabTeacher.addEventListener('click', () => switchMode('teacher'));

function switchMode(newMode) {
  mode = newMode;
  const isGroup = mode === 'group';

  tabGroup.classList.toggle('active', isGroup);
  tabTeacher.classList.toggle('active', !isGroup);
  tabGroup.setAttribute('aria-selected', String(isGroup));
  tabTeacher.setAttribute('aria-selected', String(!isGroup));

  // В режиме «Группа» видно: поиск группы + селект группы.
  // В режиме «Преподаватель» видно: только поле преподавателя.
  fieldGroup.hidden   = !isGroup;
  fieldSelect.hidden  = !isGroup;
  fieldTeacher.hidden = isGroup;
}

// ---------- загрузка справочника ----------
async function loadCatalog() {
  statusEl.className = 'status';
  statusEl.textContent = 'Загружаю справочник…';
  try {
    const r = await fetch(`${API}/api/v2/catalog`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    const rawGroups = data.groups || data.entities?.groups || [];
    const names = rawGroups
      .map(g => (typeof g === 'string' ? g : (g.name || g.title || '')))
      .filter(Boolean);
    allGroups = collapseGroups(names);
    renderGroupOptions(allGroups, DEFAULT_GROUP);

    const rawTeachers = data.teachers || data.entities?.teachers || [];
    allTeachers = rawTeachers
      .map(t => (typeof t === 'string' ? t : (t.name || t.title || '')))
      .filter(Boolean)
      .sort((a, b) => a.localeCompare(b, 'ru'));

    // Синхронизируем поле поиска с селектом после загрузки справочника
    searchInput.value = groupSelect.value || '';
    searchInput.dataset.prev = searchInput.value;

    statusEl.textContent =
      `Групп: ${names.length} → ${allGroups.length}. Преподавателей: ${allTeachers.length}.`;
  } catch (e) {
    statusEl.className = 'status error';
    statusEl.textContent = 'Не удалось загрузить справочник: ' + e.message;
  }
}

function renderGroupOptions(groups, preselect) {
  groupSelect.innerHTML = '';
  if (!groups.length) {
    groupSelect.innerHTML = '<option value="">— ничего не найдено —</option>';
    return;
  }
  for (const name of groups) {
    const o = document.createElement('option');
    o.value = name; o.textContent = name;
    groupSelect.appendChild(o);
  }
  if (preselect && groups.includes(preselect)) groupSelect.value = preselect;
}

// ---------- поиск группы ----------
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = !q ? allGroups : allGroups.filter(g => g.toLowerCase().includes(q));
  renderGroupOptions(filtered, groupSelect.value);

  // Подсветка, если набранное не совпадает с выбранной группой
  const typed = searchInput.value.trim().toLowerCase();
  const selected = (groupSelect.value || '').toLowerCase();
  searchInput.classList.toggle('mismatch', !!typed && typed !== selected);
});

searchInput.addEventListener('focus', () => {
  searchInput.dataset.prev = searchInput.value;
  searchInput.value = '';
  searchInput.classList.remove('mismatch');
  renderGroupOptions(allGroups, groupSelect.value);
});

searchInput.addEventListener('blur', () => {
  // Всегда приводим поле к актуальной выбранной группе
  searchInput.value = groupSelect.value || searchInput.dataset.prev || '';
  searchInput.classList.remove('mismatch');
});

// Когда меняется селект — синхронизируем строку поиска
groupSelect.addEventListener('change', () => {
  searchInput.value = groupSelect.value;
  searchInput.dataset.prev = groupSelect.value;
  searchInput.classList.remove('mismatch');
});

// ---------- автодополнение преподавателя ----------
let acActiveIdx = -1;

// При фокусе — очищаем поле, чтобы сразу печатать
teacherInput.addEventListener('focus', () => {
  teacherInput.dataset.prev = teacherInput.value;
  teacherInput.value = '';
  hideAC();
});

// При потере фокуса без ввода — вернуть прежнее значение
teacherInput.addEventListener('blur', () => {
  // небольшая задержка, чтобы клик по подсказке успел сработать
  setTimeout(() => {
    if (!teacherInput.value.trim()) {
      teacherInput.value = teacherInput.dataset.prev || '';
    }
  }, 150);
});

teacherInput.addEventListener('input', () => {
  const q = teacherInput.value.trim().toLowerCase();
  if (!q) { hideAC(); return; }
  const matches = allTeachers
    .filter(t => t.toLowerCase().includes(q))
    .slice(0, 30);
  showAC(matches);
});

teacherInput.addEventListener('keydown', (e) => {
  const items = [...acList.querySelectorAll('.ac-item')];
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    acActiveIdx = Math.min(acActiveIdx + 1, items.length - 1);
    paintAC(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    acActiveIdx = Math.max(acActiveIdx - 1, 0);
    paintAC(items);
  } else if (e.key === 'Enter') {
    if (acActiveIdx >= 0 && items[acActiveIdx]) {
      e.preventDefault();
      pickAC(items[acActiveIdx].textContent);
    } else {
      hideAC();
      loadSchedule();
    }
  } else if (e.key === 'Escape') {
    hideAC();
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.ac-wrap')) hideAC();
});

function showAC(items) {
  acActiveIdx = -1;
  if (!items.length) { hideAC(); return; }
  acList.innerHTML = items
    .map(t => `<div class="ac-item">${escapeHtml(t)}</div>`)
    .join('');
  acList.hidden = false;
  acList.querySelectorAll('.ac-item').forEach(el => {
    el.addEventListener('click', () => pickAC(el.textContent));
  });
}
function paintAC(items) {
  items.forEach((el, i) => el.classList.toggle('active', i === acActiveIdx));
}
function hideAC() { acList.hidden = true; acList.innerHTML = ''; acActiveIdx = -1; }
function pickAC(value) {
  teacherInput.value = value;
  teacherInput.dataset.prev = value;
  hideAC();
}

// ---------- кнопка «Показать расписание» ----------
document.getElementById('load').addEventListener('click', () => {
  if (mode === 'group') {
    const typed = searchInput.value.trim();
    if (typed) {
      const exact = allGroups.find(g => g.toLowerCase() === typed.toLowerCase());
      const partial = allGroups.filter(g => g.toLowerCase().includes(typed.toLowerCase()));
      if (exact) {
        groupSelect.value = exact;
      } else if (partial.length === 1) {
        groupSelect.value = partial[0];
      }
      // если совпадений много — оставляем значение селекта
    }
    // Синхронизируем поле поиска с итоговым выбором
    searchInput.value = groupSelect.value;
    searchInput.dataset.prev = groupSelect.value;
    searchInput.classList.remove('mismatch');
  }
  loadSchedule();
});

// ---------- запрос дня с фолбэком ----------
async function fetchDay(entityType, entity, date) {
  const url = `${API}/api/v2/schedule?entity_type=${entityType}&entity=${encodeURIComponent(entity)}&date=${date}`;
  const r = await fetch(url);
  if (r.status === 429) {
    const retry = r.headers.get('Retry-After') || '?';
    throw new Error(`Слишком много запросов. Повтори через ${retry} с.`);
  }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function dayHasLessons(data) {
  const d = data.days?.[0];
  return d && d.status === 'available' && Array.isArray(d.lessons) && d.lessons.length > 0;
}

async function loadSchedule() {
  let entityType, entity, label;
  if (mode === 'group') {
    entity = groupSelect.value;
    entityType = 'group';
    label = `группа ${entity}`;
  } else {
    entity = teacherInput.value.trim();
    entityType = 'teacher';
    label = `преподаватель ${entity}`;
  }
  if (!entity) {
    statusEl.className = 'status error';
    statusEl.textContent = 'Укажи ' + (mode === 'group' ? 'группу' : 'преподавателя') + '.';
    return;
  }

  bannerEl.innerHTML = '';
  resultEl.innerHTML = '';
  statusEl.className = 'status';
  statusEl.textContent = `Запрашиваю расписание (${label})…`;

  const today = todayISO();
  const tomorrow = plusDaysISO(today, 1);

  try {
    const tomorrowData = await fetchDay(entityType, entity, tomorrow);

    if (dayHasLessons(tomorrowData)) {
      renderBanner('info', `Расписание на завтра (${humanDate(tomorrow)}).`);
      render(tomorrowData, label);
      return;
    }

    const todayData = await fetchDay(entityType, entity, today);

    if (dayHasLessons(todayData)) {
      renderBanner('warn',
        `На завтра (${humanDate(tomorrow)}) расписания ещё нет. ` +
        `Ниже — расписание на сегодня (${humanDate(today)}).`);
      render(todayData, label);
      return;
    }

    renderBanner('muted',
      `Расписания нет ни на завтра (${humanDate(tomorrow)}), ни на сегодня (${humanDate(today)}).`);
    render(tomorrowData, label);
  } catch (e) {
    statusEl.className = 'status error';
    statusEl.textContent = 'Ошибка: ' + e.message;
  }
}

function renderBanner(kind, text) {
  bannerEl.innerHTML = `<div class="banner ${kind}">${escapeHtml(text)}</div>`;
}

// ---------- рендер ----------
function render(data, label) {
  const days = Array.isArray(data.days) ? data.days : [];
  statusEl.className = 'status';
  statusEl.textContent = `${label} · часовой пояс: ${data.timezone || '—'}`;

  if (!days.length) {
    resultEl.innerHTML = '<p class="empty">Сервер не вернул ни одного дня.</p>';
    return;
  }
  resultEl.innerHTML = days.map(renderDay).join('');
}

function renderDay(day) {
  const date = day.date || '—';
  const status = day.status || 'unknown';
  const sourceUrl = day.source?.url;
  const revision = day.source?.revision;

  const metaBits = [`status: ${status}`];
  if (revision != null) metaBits.push(`редакция: ${revision}`);
  if (sourceUrl) {
    metaBits.push(`источник: <a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener">PDF/Excel</a>`);
  }

  const lessons = Array.isArray(day.lessons) ? day.lessons : [];
  let body;
  if (status === 'missing') {
    body = '<p class="empty">Данных на эту дату нет (missing).</p>';
  } else if (status === 'no_lessons') {
    body = '<p class="empty">Занятий по расписанию нет (no_lessons).</p>';
  } else if (status === 'entity_not_found') {
    body = '<p class="empty">Не найдено в источнике на этот день.</p>';
  } else if (!lessons.length) {
    body = '<p class="empty">Занятия не указаны.</p>';
  } else {
    const rows = lessons.map(l => renderLessonRow(l, sourceUrl)).join('');
    body = `
      <table>
        <thead>
          <tr><th>#</th><th>Время</th><th>Предмет</th><th>Преподаватель</th><th>Группа</th><th>Ауд.</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  return `
    <section class="day">
      <h2>${escapeHtml(date)}</h2>
      <div class="meta">${metaBits.join(' · ')}</div>
      ${body}
    </section>`;
}

function renderLessonRow(l, sourceUrl) {
  const num   = l.pair_number ?? '';
  const time  = formatTime(l.start_time, l.end_time);
  const subj  = l.subject ?? '';
  const teach = l.teacher ?? '';
  const grp   = l.group ?? '';
  const sub   = l.subgroup ? ` (подгруппа ${l.subgroup})` : '';
  const aud   = renderAudience(l, sourceUrl);

  return `<tr>
    <td class="num" data-label="Пара">${escapeHtml(String(num))}</td>
    <td class="time" data-label="Время">${escapeHtml(time)}</td>
    <td class="subject" data-label="Предмет">${escapeHtml(subj)}${escapeHtml(sub)}</td>
    <td class="teacher" data-label="Препод.">${escapeHtml(teach)}</td>
    <td class="group" data-label="Группа">${escapeHtml(grp)}</td>
    <td class="aud ${aud.cls}" data-label="Ауд.">${aud.html}</td>
  </tr>`;
}

function renderAudience(l, sourceUrl) {
  const list = (l.audiences && l.audiences.length)
    ? l.audiences
    : (l.audience ? [l.audience] : []);
  if (list.length) return { html: escapeHtml(list.join(', ')), cls: '' };

  const tip = l.association_status
    ? `В API не распознано (${l.association_status}). Открыть источник`
    : 'В API пусто. Открыть источник';

  if (sourceUrl) {
    return { html: `<a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener" title="${escapeHtml(tip)}">PDF</a>`, cls: 'no-aud' };
  }
  return { html: `<span title="${escapeHtml(tip)}">—</span>`, cls: 'no-aud' };
}

function formatTime(start, end) {
  if (!start && !end) return '';
  if (start && end)   return `${start}–${end}`;
  return start || end;
}

// ---------- init ----------
switchMode('group');
loadCatalog().then(() => loadSchedule());
</script>
</body>
</html>
